<div class="titulo">
    <h2>REGISTRO DE USUARIOS</h2>
</div>

<form  [formGroup]="form">

    <div class="nombre">
        <label for="name">Nombre</label>
        <input type="text" id="name" formControlName="name" placeholder="Ingrese su nombre"/>
        <p class="error" *ngIf = "invalidado ('name', 'required')">
            El nombre es requerido
        </p>
        <p class="error" *ngIf = "invalidado ('name', 'minlength')">
            El nombre debe tener al menos 3 caracteres
        </p>
    </div>

    <div class="correo">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" formControlName="email" placeholder="Ingrese su correo electrónico"/>
        <p class="error" *ngIf = "invalidado ('email', 'required')">
            El correo electrónico es requerido
        </p>
        <p class="error" *ngIf = "invalidado ('email', 'email')">
            El correo electrónico no es válido
        </p>
    </div>

    


</form>
